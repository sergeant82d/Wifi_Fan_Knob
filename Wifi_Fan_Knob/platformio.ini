; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; Below changed from default by Claude:

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Elecrow CrowPanel 1.28: 16 MB QIO flash, OPI PSRAM (devkitc-1 default is 8 MB / QSPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; 2× 6.25 MB OTA app slots, 3.4 MB SPIFFS

; Web UI compiled into firmware (not SPIFFS), so page updates never wipe /config.json
board_build.embed_txtfiles = web/index.html

lib_deps =
    lvgl/LVGL@^8.4.0
    lovyan03/LovyanGFX@^1.1.0
    adafruit/Adafruit BusIO@^1.14.5
    bblanchon/ArduinoJson@^6.21.0
    esp32async/ESPAsyncWebServer@^3.7.0
    knolleary/PubSubClient@^2.8

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial → native USB (board has no USB-UART chip)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include/

monitor_filters = esp32_exception_decoder

